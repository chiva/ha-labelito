name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # "true" only on the push that actually publishes a release — gates the zip job.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token, not GITHUB_TOKEN: GitHub starts no workflows for events made with
      # GITHUB_TOKEN, so the release PR it opened never got its required checks.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # release-type "simple" tracks the version in .release-please-manifest.json and syncs it
          # into manifest.json via the extra-files rule in release-please-config.json.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # HACS installs from the GitHub Release's attached zip (hacs.json sets zip_release/filename), so
  # build and attach it in the same run release-please publishes the release.
  zip:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Build integration zip
        run: |
          cd custom_components/labelito
          zip -r labelito.zip . -x '*.pyc' -x '*__pycache__*'

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" custom_components/labelito/labelito.zip --clobber
