# La gramática de voz con comodines. Dos formas de instalarla:
#
#   * llama al servicio labelito.write_voice_sentences — escribe este archivo si falta, más un
#     labelito-templates.yaml generado que reconoce tus nombres de plantilla EXACTAMENTE en lugar
#     de adivinarlos desde el comodín de abajo;
#   * o copia este archivo a mano a <config>/custom_sentences/es/labelito.yaml (las integraciones
#     no pueden incluir frases personalizadas; Home Assistant solo las carga desde config).
#
# En cualquier caso este archivo es tuyo para editarlo: el servicio nunca lo sobrescribe. Ver
# docs/voice-assist.md.
language: es
intents:
  LabelitoPrint:
    data:
    - sentences:
      - (imprime|imprímeme|imprimeme|haz|hazme|saca|sácame|sacame) ([una|la|otra] etiqueta|{labelito_copies:copies} etiquetas|{labelito_copies:copies} copias de [la] etiqueta) [de|del|de la] {labelito_template:template} (para|que diga|que ponga|con el texto) {labelito_text:text}
    - sentences:
      - (imprime|imprímeme|imprimeme|haz|hazme|saca|sácame|sacame) ([una|la|otra] etiqueta|{labelito_copies:copies} etiquetas|{labelito_copies:copies} copias de [la] etiqueta) [de|del|de la] {labelito_template:template}
lists:
  labelito_template:
    wildcard: true
  labelito_text:
    wildcard: true
  labelito_copies:
    range:
      from: 1
      to: 100
