# The wildcard voice grammar. Two ways to install it:
#
#   * call the labelito.write_voice_sentences service — it writes this file if missing, plus a
#     generated labelito-templates.yaml that matches your template names EXACTLY instead of
#     guessing them out of the wildcard below;
#   * or copy this file by hand to <config>/custom_sentences/en/labelito.yaml (integrations cannot
#     ship custom sentences; Home Assistant only loads them from config).
#
# Either way this file is yours to edit — the service never overwrites it. See
# docs/voice-assist.md.
language: en
intents:
  LabelitoPrint:
    data:
    - sentences:
      - print [a] {labelito_template:template} label [for] {labelito_text:text}
      - print [a] {labelito_template:template} label [that says] {labelito_text:text}
      - make [a] {labelito_template:template} label [for] {labelito_text:text}
      - make [a] {labelito_template:template} label [that says] {labelito_text:text}
    - sentences:
      - print [a] {labelito_template:template} label
      - make [a] {labelito_template:template} label
lists:
  labelito_template:
    wildcard: true
  labelito_text:
    wildcard: true
